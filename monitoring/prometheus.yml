global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # -----------------------------------------------------------------------
  # HRIS PHP Application Metrics
  # Scraped from the hris-exporter sidecar running inside Docker.
  # No Windows Firewall rules needed.
  # -----------------------------------------------------------------------
  - job_name: 'hris_php_app'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'hris-exporter:9091'
    metrics_path: '/monitoring/metrics.php'
    scheme: http

  # -----------------------------------------------------------------------
  # Prometheus self-monitoring
  # -----------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
