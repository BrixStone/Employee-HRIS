global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # -----------------------------------------------------------------------
  # HRIS PHP Application Metrics
  # Scraped from the hris-exporter container on the shared Docker network.
  # -----------------------------------------------------------------------
  - job_name: 'hris_php_app'
    scrape_interval: 30s
    # metrics.php queries Supabase over the internet; a scrape can take
    # several seconds, so allow more than the 10s default.
    scrape_timeout: 25s
    metrics_path: '/monitoring/metrics.php'
    scheme: http
    static_configs:
      - targets: ['hris-exporter:9091']
        labels:
          app: 'hris'

  
  # ---------------------------------------------------------
  # HRIS WebSocket / Real-time metrics
  # ---------------------------------------------------------
  - job_name: 'hris_realtime'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['realtime:8090']
        labels:
          app: 'hris'

  # -----------------------------------------------------------------------
  # Prometheus self-monitoring
  # -----------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
