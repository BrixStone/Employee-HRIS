global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Scrape metrics from the PHP exporter in Docker Compose
  - job_name: hris_exporter
    metrics_path: /monitoring/metrics.php
    static_configs:
      - targets:
          - hris-exporter:9091
        labels:
          app: hris
