apiVersion: 1

# Remove any previously provisioned "Prometheus" datasource (it was created
# without a fixed uid) so it is re-created below with uid "prometheus".
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    # Every panel in hris_dashboard.json references this exact uid.
    # Without it Grafana generates a random uid and all panels show "No data".
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '30s'
      httpMethod: POST
