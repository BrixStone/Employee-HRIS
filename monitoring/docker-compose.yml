# ============================================================
# HRIS Monitoring Stack
# - Prometheus:    collects metrics from the PHP exporter sidecar
# - Grafana:       visualizes metrics with a pre-built dashboard
# - hris-exporter: PHP-CLI server running metrics.php inside Docker
#                  (bypasses Windows Firewall entirely — no admin needed)
#
# Usage:
#   docker compose up -d
#
# Access:
#   Grafana    → http://localhost:3000  (user: admin / password: hris@admin)
#   Prometheus → http://localhost:9090
#   Metrics    → http://localhost:9091/monitoring/metrics.php
# ============================================================

services:

  # ----------------------------------------------------------
  # PHP metrics exporter — runs metrics.php INSIDE Docker so
  # Prometheus can scrape it without Windows Firewall issues.
  # Mounts the project root read-only.
  # ----------------------------------------------------------
  hris-exporter:
    image: php:8.3-cli
    container_name: hris_exporter
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - ../:/app:ro
    working_dir: /app
    # Install pdo_pgsql extension then start PHP built-in server
    command: >
      sh -c "
        apt-get update -qq &&
        apt-get install -y -qq libpq-dev &&
        docker-php-ext-install pdo pdo_pgsql &&
        php -S 0.0.0.0:9091 -t /app
      "
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: hris_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - hris-exporter
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: hris_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hris@admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  monitoring:
    driver: bridge
