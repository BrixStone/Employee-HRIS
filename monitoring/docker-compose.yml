# ============================================================
# HRIS Docker Compose
#
# Managed by Docker Compose:
#   - MySQL
#   - PHP application
#   - PHP metrics exporter
#
# Managed separately by Terraform:
#   - Prometheus
#   - Grafana
#   - Realtime WebSocket server
#
# Startup order:
#   1. Run terraform init and terraform apply
#   2. Run docker compose up -d --build
#
# Access:
#   HRIS       -> http://localhost:8000
#   Metrics    -> http://localhost:9091/monitoring/metrics.php
#   Prometheus -> http://localhost:9090
#   Grafana    -> http://localhost:3000
#   WebSocket  -> ws://localhost:8090/ws
# ============================================================
name: hris-docker
services:
  mysql:
    image: mysql:8.0
    container_name: hris_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hris
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: hris_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monitoring

  hris-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
    working_dir: /app
    command: ["php", "-S", "0.0.0.0:8000", "-t", "/app"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hris
      DB_USER: hris_app
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring
      - hris_net

  # ----------------------------------------------------------
  # PHP metrics exporter
  # ----------------------------------------------------------
  hris-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitoring-hris-exporter
    container_name: hris_exporter
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - ../:/app:ro
    working_dir: /app
    command: ["php", "-S", "0.0.0.0:9091", "-t", "/app"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hris
      DB_USER: hris_app
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      monitoring:
      hris_net:
        aliases:
          - hris-exporter

volumes:
  mysql_data:

networks:
  monitoring:
    driver: bridge

  # Terraform must create this network first.
  # Compose will reuse it instead of creating or managing it.
  hris_net:
    external: true
    name: hris_net
