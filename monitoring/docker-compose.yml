# ============================================================
# HRIS Docker Compose
#
# Managed by Docker Compose:
#   - MySQL
#   - PHP application
#   - PHP metrics exporter
#
# Managed separately by Terraform:
#   - Prometheus
#   - Grafana
#   - Realtime WebSocket server
#
# Startup order:
#   1. Run terraform init and terraform apply
#   2. Run docker compose up -d --build
#
# Access:
#   HRIS       -> http://localhost:8000
#   Metrics    -> http://localhost:9091/monitoring/metrics.php
#   Prometheus -> http://localhost:9090
#   Grafana    -> http://localhost:3000
#   WebSocket  -> ws://localhost:8090/ws
# ============================================================
name: hris-docker
services:
  mysql:
    image: mysql:8.0
    container_name: hris_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hris
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: hris_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monitoring

  hris-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
    working_dir: /app
    command: ["php", "-S", "0.0.0.0:8000", "-t", "/app"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hris
      DB_USER: hris_app
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring
      - hris_net
  hris-seeder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris_seeder
    volumes:
      - ../:/app
    working_dir: /app
    command: ["php", "database/seed_sample_data.php"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hris
      DB_USER: hris_app
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring
    restart: "no"
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hris_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring

  # ----------------------------------------------------------
  # PHP metrics exporter
  # ----------------------------------------------------------
  hris-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitoring-hris-exporter
    container_name: hris_exporter
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - ../:/app:ro
    working_dir: /app
    command: ["php", "-S", "0.0.0.0:9091", "-t", "/app"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hris
      DB_USER: hris_app
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      monitoring:
      hris_net:
        aliases:
          - hris-exporter

  # ----------------------------------------------------------
  # Scheduled jobs (replaces cron / Windows Task Scheduler)
  #
  # Runs cron/expire_pending_leaves.php on start and then every
  # CRON_INTERVAL_SECONDS: reminds HR about Pending leave and
  # auto-rejects it at CRON_REJECT_DAYS. Logs: docker logs hris_cron
  # ----------------------------------------------------------
  hris-cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris_cron
    restart: unless-stopped
    init: true                  # so `docker stop` ends the loop immediately
    volumes:
      - ../:/app:ro
    working_dir: /app
    command: ["php", "/app/cron/scheduler.php"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hris
      DB_USER: hris_app
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      CRON_INTERVAL_SECONDS: "${CRON_INTERVAL_SECONDS:-3600}"
      CRON_REJECT_DAYS: "${CRON_REJECT_DAYS:-14}"
      CRON_REMIND_EVERY: "${CRON_REMIND_EVERY:-3}"
    healthcheck:
      # Healthy while the scheduler keeps finishing runs (within 2 intervals).
      test:
        - CMD
        - php
        - -r
        - "exit((time()-(int)@filemtime('/tmp/hris_cron_heartbeat'))<(2*(int)(getenv('CRON_INTERVAL_SECONDS')?:3600)+300)?0:1);"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring
      - hris_net              # reach hris-realtime to push live notifications

volumes:
  mysql_data:

networks:
  monitoring:
    driver: bridge

  # Terraform must create this network first.
  # Compose will reuse it instead of creating or managing it.
  hris_net:
    external: true
    name: hris_net
