# ============================================================
# HRIS Monitoring Stack
# - Prometheus:    collects metrics from the PHP exporter sidecar
# - Grafana:       visualizes metrics with a pre-built dashboard
# - hris-exporter: PHP-CLI server running metrics.php inside Docker
#                  (bypasses Windows Firewall entirely — no admin needed)
#
# Usage:
#   docker compose up -d
#
# Access:
#   Grafana    → http://localhost:3000  (user: admin / password: admin123)
#   Prometheus → http://localhost:9090
#   Metrics    → http://localhost:9091/monitoring/metrics.php
# ============================================================


services:
  mysql:
    image: mysql:8.0
    container_name: hris_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hris
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: hris_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monitoring

  hris-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
    working_dir: /app
    command: ["php", "-S", "0.0.0.0:8000", "-t", "/app"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hris
      DB_USER: hris_app
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring

  hris-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris_exporter
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - ../:/app:ro
    working_dir: /app
    command: ["php", "-S", "0.0.0.0:9091", "-t", "/app"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hris
      DB_USER: hris_app
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: hris_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - hris-exporter
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: hris_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge

