# ============================================================
# NOTE: terraform/ now runs this same stack plus the real-time
# WebSocket server (cd terraform; terraform apply). Use either
# Terraform or this compose file, not both: they share ports
# and container names.
#
# HRIS Monitoring Stack
# - Prometheus:    collects metrics from the PHP exporter sidecar
# - Grafana:       visualizes metrics with a pre-built dashboard
# - hris-exporter: PHP-CLI server running metrics.php inside Docker
#                  (bypasses Windows Firewall entirely — no admin needed)
#
# Usage:
#   cd monitoring
#   docker compose up -d --build
#
# Access:
#   Grafana    → http://localhost:3000  (user: admin / password: hris@admin)
#   Prometheus → http://localhost:9090
#   Metrics    → http://localhost:9091/monitoring/metrics.php
# ============================================================

services:

  # ----------------------------------------------------------
  # PHP metrics exporter — runs metrics.php INSIDE Docker so
  # Prometheus can scrape it without Windows Firewall issues.
  # Mounts the project root read-only.
  # ----------------------------------------------------------
  hris-exporter:
    # Built from monitoring/exporter/Dockerfile (pdo_mysql pre-installed)
    build:
      context: ./exporter
    image: hris-exporter:latest
    container_name: hris_exporter
    restart: unless-stopped
    ports:
      # Bound to localhost only: the metrics are for this machine, not the LAN
      - "127.0.0.1:9091:9091"
    volumes:
      - ../:/app:ro
    working_dir: /app
    # MySQL (XAMPP) runs on the Windows host, not in this container, so
    # config/database.php is pointed at the host through these variables.
    environment:
      DB_HOST: ${HRIS_DB_HOST:-host.docker.internal}
      DB_PORT: ${HRIS_DB_PORT:-3306}
      DB_NAME: ${HRIS_DB_NAME:-hris}
      # Same account as the app (XAMPP default). For a read-only account, run
      #   GRANT SELECT ON hris.* TO 'hris_metrics'@'127.0.0.1' IDENTIFIED BY '...';
      # and set HRIS_DB_USER / HRIS_DB_PASS before `docker compose up`.
      DB_USER: ${HRIS_DB_USER:-root}
      DB_PASS: ${HRIS_DB_PASS:-}
    # Makes host.docker.internal resolvable on this custom network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:9091/monitoring/metrics.php') ? 0 : 1);"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 10s
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: hris_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - hris-exporter
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: hris_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hris@admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  monitoring:
    driver: bridge
